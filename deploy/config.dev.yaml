# 開発環境（docker compose）用の設定
# false なので、画面で対象に選んだ VM は実際に変わる
dry_run: false

autoscale:
  interval: 10s
  cooldown: 1m
  window: 30s
  default:
    cpu: { min: 1, max: 4, step: 0.5, up_threshold: 80, down_threshold: 20 }
    memory: { min_mb: 512, max_mb: 8192, step_mb: 256, margin_mb: 256, up_threshold: 85, down_threshold: 30 }
