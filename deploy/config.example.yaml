# 設定ファイルの例（本番では /etc/proxconductor/config.yaml に置き、-config で指定する）
# APIトークンなどの秘密情報はここに書かず、環境変数で渡す（.env.example を参照）

# true の間は VM を変更せず、「何をするか」だけを記録する
dry_run: true

autoscale:
  interval: 30s # 判定の間隔
  cooldown: 5m # 同じ VM を続けて変更しない時間
  window: 2m # この期間の平均使用率で判定する

  # 画面で対象に選んだ VM すべてに使う決まり（しきい値は %）
  default:
    # CPU の上限（cpulimit）。単位はコア数。VM のコア数を超えては上げない
    cpu: { min: 1, max: 4, step: 0.5, up_threshold: 80, down_threshold: 20 }
    # メモリ（バルーン）。VM のメモリの設定値を超えては増やさない
    memory: { min_mb: 1024, max_mb: 8192, step_mb: 512, margin_mb: 256, up_threshold: 85, down_threshold: 30 }

  # 特定の VM だけ決まりを変えたいとき
  overrides:
    - vmid: 101
      cpu: { min: 2, max: 8, step: 1, up_threshold: 80, down_threshold: 20 }
      memory: { min_mb: 2048, max_mb: 16384, step_mb: 1024, margin_mb: 512, up_threshold: 85, down_threshold: 30 }
